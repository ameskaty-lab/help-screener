<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>HELP Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="HELP Tracker" />
<meta name="theme-color" content="#4f46e5" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon.png" />
<link rel="icon" href="icon.png" />
<style>
  :root{
    --bg:#f8fafc; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --brand:#4f46e5; --brand-soft:#eef2ff;
    --notyet:#dc2626; --notyet-bg:#fef2f2;
    --emerging:#d97706; --emerging-bg:#fffbeb;
    --mastered:#059669; --mastered-bg:#ecfdf5;
    --assess:#0284c7; --assess-bg:#f0f9ff;
    --radius:12px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    padding-bottom:env(safe-area-inset-bottom);
  }
  button{font:inherit;cursor:pointer;-webkit-appearance:none;touch-action:manipulation}
  input,textarea,select{font:inherit;-webkit-appearance:none}

  header{
    position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  }
  .h-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  h1{margin:0;font-size:17px;font-weight:650;letter-spacing:.2px}
  .agechip{
    background:rgba(255,255,255,.18);border:0;color:#fff;
    padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;
  }
  nav{display:flex;gap:6px;margin-top:10px}
  nav button{
    flex:1;background:rgba(255,255,255,.14);border:0;color:#fff;
    padding:8px 4px;border-radius:9px;font-size:13.5px;font-weight:600;opacity:.75;
  }
  nav button[aria-current="true"]{background:#fff;color:var(--brand);opacity:1}

  main{padding:14px 12px 40px;max-width:760px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
  .card h2{margin:0 0 4px;font-size:15px;font-weight:650}
  .card p.sub{margin:0 0 10px;color:var(--muted);font-size:13px}
  .muted{color:var(--muted)}
  .small{font-size:12.5px}

  label.field{display:block;margin:10px 0 0}
  label.field span{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:4px}
  input[type=date],input[type=text],input[type=number],textarea,select{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)
  }
  textarea{resize:vertical;min-height:64px}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .stat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 8px;text-align:center}
  .stat b{display:block;font-size:19px;line-height:1.2}
  .stat span{font-size:11px;color:var(--muted);letter-spacing:.2px}

  .bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:7px}
  .bar i{display:block;height:100%;background:var(--mastered)}

  .filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .chip{
    background:#fff;border:1px solid var(--line);color:var(--ink);
    padding:6px 11px;border-radius:999px;font-size:13px;font-weight:550
  }
  .chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}

  ul.items{list-style:none;margin:0;padding:0}
  li.item{border:1px solid var(--line);border-radius:var(--radius);background:#fff;margin-bottom:8px;overflow:hidden}
  .item-head{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;width:100%;text-align:left;background:none;border:0;color:inherit}
  .dot{flex:0 0 auto;width:11px;height:11px;border-radius:50%;margin-top:5px;background:var(--line);border:1px solid #cbd5e1}
  .dot.notyet{background:var(--notyet);border-color:var(--notyet)}
  .dot.emerging{background:var(--emerging);border-color:var(--emerging)}
  .dot.mastered{background:var(--mastered);border-color:var(--mastered)}
  .dot.assess{background:var(--assess);border-color:var(--assess)}
  .item-main{flex:1;min-width:0}
  .item-skill{font-size:14.5px}
  .item-meta{margin-top:3px;font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
  .tag{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:11.5px}
  .tag.warn{background:#fff7ed;border-color:#fed7aa;color:#9a3412}
  .tag.book{background:var(--brand-soft);border-color:#c7d2fe;color:#3730a3}

  .item-body{padding:0 12px 12px;border-top:1px solid var(--line);display:none}
  li.item.open .item-body{display:block}
  .statusrow{display:flex;gap:6px;margin:12px 0 4px;flex-wrap:wrap}
  .statusrow button{
    flex:1 1 0;min-width:82px;padding:9px 6px;border-radius:9px;border:1px solid var(--line);
    background:#fff;font-size:13px;font-weight:600;color:var(--muted)
  }
  .statusrow button[aria-pressed="true"].notyet{background:var(--notyet-bg);border-color:var(--notyet);color:var(--notyet)}
  .statusrow button[aria-pressed="true"].emerging{background:var(--emerging-bg);border-color:var(--emerging);color:var(--emerging)}
  .statusrow button[aria-pressed="true"].mastered{background:var(--mastered-bg);border-color:var(--mastered);color:var(--mastered)}
  .statusrow button[aria-pressed="true"].assess{background:var(--assess-bg);border-color:var(--assess);color:var(--assess)}
  .tag.assess{background:var(--assess-bg);border-color:#bae6fd;color:#075985}
  .planbox{background:var(--assess-bg);border:1px solid #bae6fd;border-radius:10px;padding:10px 12px;margin-top:12px}
  .planbox span.lbl{display:block;font-size:12.5px;font-weight:650;color:#075985;margin-bottom:6px}
  .planbox textarea{min-height:56px}

  /* assessment sheet */
  .sheet-item{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:#fff}
  .sheet-item h3{margin:0 0 4px;font-size:14.5px;font-weight:600}
  .sheet-meta{font-size:12px;color:var(--muted);margin-bottom:8px}
  .sheet-plan{font-size:13px;margin:0 0 10px}
  .sheet-plan b{color:#075985}
  /* display:block matters: a border-bottom on an inline span ignores height,
     so the write-on rule would collapse to nothing */
  .sheet-blank{display:block;border-bottom:1px solid #94a3b8;height:22px;margin-top:6px}
  .sheet-result .sheet-blank{height:26px}
  .sheet-result{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
  .sheet-result b{color:var(--ink);font-weight:600}
  .sheet-act{display:flex;gap:8px;align-items:center;margin:0 0 8px}
  .sheet-act input{flex:1;padding:7px 9px;font-size:13px}
  .sheet-act label{font-size:12.5px;font-weight:650;color:#075985;white-space:nowrap}
  .sheet-item .statusrow{margin:8px 0 0}
  .sheet-item .statusrow button{min-width:70px;padding:8px 6px;font-size:12.5px}
  .printonly{display:none}
  .short-only{display:none}
  .copyout{
    width:100%;min-height:130px;margin-top:8px;padding:9px 10px;
    border:1px solid var(--line);border-radius:9px;background:#fff;
    font-size:12px;line-height:1.4;color:var(--ink)
  }
  .warnbar{
    background:#fef2f2;border:1px solid var(--notyet);color:#7f1d1d;
    border-radius:10px;padding:11px 13px;font-size:13px;
    max-width:760px;margin:14px auto -2px;width:calc(100% - 24px)
  }
  .warnbar b{display:block;margin-bottom:3px}



  .ideas{list-style:none;margin:6px 0 0;padding:0}
  .ideas li{display:flex;gap:8px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:6px;font-size:13.5px}
  .ideas li span{flex:1}
  .ideas li button{background:none;border:0;color:var(--muted);font-size:16px;line-height:1;padding:0 2px}
  .addrow{display:flex;gap:6px;margin-top:6px}
  .addrow input{flex:1}
  .btn{background:var(--brand);border:1px solid var(--brand);color:#fff;padding:9px 14px;border-radius:9px;font-weight:600;font-size:13.5px}
  .btn.ghost{background:#fff;color:var(--brand)}
  .btn.wide{width:100%;margin-top:8px}

  .empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:13.5px}
  details.foot{margin-top:10px}
  details.foot summary{font-size:13px;color:var(--muted);cursor:pointer}
  details.foot div{margin-top:8px}
  .legend dt{font-weight:650;margin-top:8px;font-size:13.5px}
  .legend dd{margin:2px 0 0;color:var(--muted);font-size:13px}
  .note{background:var(--brand-soft);border:1px solid #c7d2fe;border-radius:10px;padding:10px 12px;font-size:13px;color:#3730a3}
  .sectionlabel{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:16px 0 7px}
  .sectionlabel:first-child{margin-top:0}

  .band{border:1px solid var(--line);border-radius:var(--radius);background:#fff;margin-bottom:10px;overflow:hidden}
  .band-head{display:flex;gap:10px;align-items:center;padding:11px 12px;background:var(--bg);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .band-title{flex:1;min-width:120px}
  .band-title b{display:block;font-size:14.5px}
  .band-title span{font-size:12px;color:var(--muted)}
  .band-head .btn{padding:7px 11px;font-size:12.5px;white-space:nowrap}
  .band-body{padding:8px 8px 2px}
  .band-body ul.items{margin:0}
  .band.collapsed .band-body{display:none}
  .band-toggle{background:none;border:0;color:var(--muted);font-size:13px;padding:4px 6px}

  .band-foot{border-top:1px solid var(--line);padding:12px;background:var(--bg)}
  .band-foot .btn{width:100%}
  .sweep-row{display:flex;gap:8px;margin-top:8px}
  .sweep-row .btn{flex:1 1 0;min-width:0;padding:9px 6px}
  .band-foot p{margin:0 0 8px;font-size:12.5px;color:var(--muted)}

  .undobar{
    display:flex;gap:10px;align-items:center;
    background:var(--mastered-bg);border:1px solid var(--mastered);color:#065f46;
    border-radius:10px;padding:10px 12px;font-size:13px
  }
  .undobar span{flex:1}
  .undobar button{background:#fff;border:1px solid var(--mastered);color:var(--mastered);padding:7px 13px;border-radius:8px;font-weight:650;font-size:12.5px;white-space:nowrap}
  @media print{
    @page{ margin: 13mm 12mm; }
    header, nav, .noprint{display:none !important}
    body{
      background:#fff;color:#000;
      font-size:8.6pt;line-height:1.3;
      -webkit-font-smoothing:antialiased
    }
    main{padding:0;max-width:none}
    .card{border:0;padding:0;margin:0;background:none}
    .card h2{font-size:11.5pt;font-weight:600;letter-spacing:-.1px;margin:0 0 1px}
    .card p.sub{font-size:7.6pt;margin:0;color:#555}
    .sheet-legend{margin:1px 0 7px !important;color:#666}
    .printonly{display:block !important}
    .long-only{display:none}
    .short-only{display:inline}
    .by-activity .act-bit{display:none}

    /* group heading: a rule and a quiet label, nothing more */
    .sectionlabel{
      font-size:7.4pt;font-weight:700;letter-spacing:.7px;color:#000;
      margin:9px 0 3px;padding-top:4px;border-top:.75pt solid #000;break-after:avoid
    }

    /* one skill: name and reference on a line, how-to under it, ticks under that */
    .sheet-item{
      border:0;border-bottom:.4pt solid #d6d6d6;border-radius:0;
      padding:2.5px 0 3.5px;margin:0;background:none;
      break-inside:avoid;page-break-inside:avoid
    }
    .sheet-item h3{display:inline;font-size:8.8pt;font-weight:600;letter-spacing:-.1px;margin:0;color:#000}
    .sheet-meta{display:inline;font-size:7pt;font-weight:400;color:#777;margin:0 0 0 5px;letter-spacing:0}
    .sheet-plan{font-size:8pt;margin:0;color:#333}

    .sheet-result{
      font-size:7.6pt;border:0;padding:0;margin:0;color:#555;
      display:flex !important;gap:7px;align-items:flex-end
    }
    .ticks{white-space:nowrap;letter-spacing:.2px}
    .sheet-blank{height:9px;margin:0;flex:1;border-bottom:.4pt solid #888}
    /* base stylesheet has .sheet-result .sheet-blank{height:26px}; match its
       specificity or every result row keeps a 26px gap on paper */
    .sheet-result .sheet-blank{height:9px}
    .sheet-plan .sheet-blank{display:inline-block;width:62%;vertical-align:baseline;margin:0}

    .roomy .sheet-item{padding:7px 0 9px}
    .roomy .sheet-blank{height:20px}
    .roomy .sheet-result .sheet-blank{height:20px}
    .roomy .sheet-plan .sheet-blank{width:72%}
  }
</style>
</head>
<body>

<header>
  <div class="h-row">
    <h1>HELP Tracker</h1>
    <button class="agechip" id="agechip" type="button">Set age</button>
  </div>
  <nav>
    <button type="button" data-tab="focus" aria-current="true">Focus</button>
    <button type="button" data-tab="skills">Skills</button>
    <button type="button" data-tab="assess">Assess</button>
    <button type="button" data-tab="setup">Setup</button>
  </nav>
</header>

<div id="storagewarn" class="warnbar" hidden>
  <b>This browser is not letting the app save.</b>
  Anything you mark will be lost when you close it. Try opening the app a different
  way &mdash; from a web address rather than straight from the file &mdash; or turn off
  Private Browsing.
</div>

<main>
  <section id="view-focus"></section>
  <section id="view-skills" hidden></section>
  <section id="view-assess" hidden></section>
  <section id="view-setup" hidden></section>
</main>

<script>
/* ---------------------------------------------------------------
   HELP Checklist item data.
   Transcribed from: HELP Checklist (Hawaii Early Learning Profile),
   Ages Birth to Three years, VORT Corporation, 1984/1988.
   Fields: id, a=area, age=printed age range (mo.), lo/hi=parsed bounds,
           s=skill text, h=HELP...at Home page, f=footnote number.
   --------------------------------------------------------------- */
const BASE_ITEMS = [
{"id":"1.01","a":1,"age":"0-1","lo":0.0,"hi":1.0,"s":"Quiets when picked up","h":"1"},
{"id":"1.02","a":1,"age":"0-6","lo":0.0,"hi":6.0,"s":"Shows pleasure when touched and handled","h":"373"},
{"id":"1.03","a":1,"age":"0-1","lo":0.0,"hi":1.0,"s":"Responds to sounds","h":"2"},
{"id":"1.04","a":1,"age":"0-2½","lo":0.0,"hi":2.5,"s":"Responds to voice","h":"4"},
{"id":"1.05","a":1,"age":"1-2","lo":1.0,"hi":2.0,"s":"Inspects surroundings","h":"6"},
{"id":"1.06","a":1,"age":"1-6","lo":1.0,"hi":6.0,"s":"Shows active interest in person or object for at least 1 minute","h":"7"},
{"id":"1.07","a":1,"age":"1-3","lo":1.0,"hi":3.0,"s":"Listens to voice for 30 seconds","h":"4"},
{"id":"1.08","a":1,"age":"1½-4","lo":1.5,"hi":4.0,"s":"Shows anticipatory excitement","h":"8"},
{"id":"1.09","a":1,"age":"2-3","lo":2.0,"hi":3.0,"s":"Reacts to disappearance of slowly moving object","h":"10"},
{"id":"1.10","a":1,"age":"2-3½","lo":2.0,"hi":3.5,"s":"Searches with eyes for sound","h":"2"},
{"id":"1.11","a":1,"age":"2-3","lo":2.0,"hi":3.0,"s":"Inspects own hands","h":"12"},
{"id":"1.12","a":1,"age":"2-3","lo":2.0,"hi":3.0,"s":"Watches speaker's eyes and mouth","h":"13"},
{"id":"1.13","a":1,"age":"2½-4","lo":2.5,"hi":4.0,"s":"Begins play with rattle","h":"14"},
{"id":"1.14","a":1,"age":"3-4","lo":3.0,"hi":4.0,"s":"Enjoys repeating newly learned activity","h":"15"},
{"id":"1.15","a":1,"age":"3-6","lo":3.0,"hi":6.0,"s":"Uses hands and mouth for sensory exploration of objects","h":"16"},
{"id":"1.16","a":1,"age":"3-7","lo":3.0,"hi":7.0,"s":"Turns eyes and head to sound of hidden voice","h":"17"},
{"id":"1.17","a":1,"age":"3-5","lo":3.0,"hi":5.0,"s":"Plays with own hands, feet, fingers, toes","h":"18"},

{"id":"1.22","a":1,"age":"4-6","lo":4.0,"hi":6.0,"s":"Localizes tactile stimulation by touching the same spot or searching for object that touched body","h":"25"},
{"id":"1.23","a":1,"age":"4½-7","lo":4.5,"hi":7.0,"s":"Plays with paper","h":"26"},
{"id":"1.24","a":1,"age":"5-9","lo":5.0,"hi":9.0,"s":"Touches toy or adult's hand to restart an activity","h":"27"},
{"id":"1.25","a":1,"age":"5-6½","lo":5.0,"hi":6.5,"s":"Reaches for second object purposefully","h":"28"},
{"id":"1.26","a":1,"age":"5-9","lo":5.0,"hi":9.0,"s":"Works for desired, out of reach object","h":"29"},
{"id":"1.27","a":1,"age":"5-6½","lo":5.0,"hi":6.5,"s":"Distinguishes between friendly and angry voices","h":"30"},

{"id":"1.46","a":1,"age":"?-11","lo":null,"hi":11.0,"s":"Overcomes obstacle to obtain object","h":"49"},
{"id":"1.47","a":1,"age":"8-10","lo":8.0,"hi":10.0,"s":"Retrieves object using other material","h":"50"},

{"id":"1.49","a":1,"age":"9-10","lo":9.0,"hi":10.0,"s":"Finds hidden object under three superimposed screens","h":"52"},
{"id":"1.50","a":1,"age":"9-12","lo":9.0,"hi":12.0,"s":"Guides action on toy manually","h":"53"},

{"id":"1.53","a":1,"age":"9-12","lo":9.0,"hi":12.0,"s":"Uses locomotion to regain object and resumes play","h":"55"},
{"id":"1.54","a":1,"age":"9-11","lo":9.0,"hi":11.0,"s":"Listens to speech without being distracted by other sources","h":"56"},
{"id":"1.55","a":1,"age":"9-12","lo":9.0,"hi":12.0,"s":"Knows what \"no-no\" means and reacts","h":"57"},

/* ITEMS is BASE_ITEMS with your corrections applied. Everything else in the app
   reads ITEMS, so a fix flows through flagging, bands, the sheet and printing. */
let ITEMS = BASE_ITEMS;

/* "8-10", "5½-7½", "33+" -> numeric bounds. Returns null if it can't be read,
   and a bad value is never saved. */
function parseAge(label){
  const a = String(label == null ? "" : label).trim();
  if(!a) return null;
  const num = t => {
    t = t.trim().replace(/\u00bd/g, ".5").replace(/\s+/g, "");
    if(!t || t === "?") return null;
    return /^\d+(\.\d+)?$/.test(t) ? parseFloat(t) : NaN;
  };
  if(/\+$/.test(a)){
    const lo = num(a.slice(0, -1));
    return (lo === null || Number.isNaN(lo)) ? null : {lo: lo, hi: null};
  }
  const parts = a.split("-");
  if(parts.length !== 2) return null;
  const lo = num(parts[0]), hi = num(parts[1]);
  if(Number.isNaN(lo) || Number.isNaN(hi) || hi === null) return null;
  return {lo: lo, hi: hi};
}

function applyFixes(){
  const fx = db.fix || {};
  ITEMS = BASE_ITEMS.map(it => {
    const f = fx[it.id];
    if(!f) return it;
    const out = Object.assign({}, it);
    if(f.h != null && f.h !== "") out.h = f.h;
    if(f.s != null && f.s !== "") out.s = f.s;
    if(f.age != null && f.age !== ""){
      const parsed = parseAge(f.age);
      if(parsed){ out.age = f.age; out.lo = parsed.lo; out.hi = parsed.hi; }
    }
    out.fixed = true;
    return out;
  });
}
function baseItem(id){ return BASE_ITEMS.find(i => i.id === id); }
function fixCount(){ return Object.keys(db.fix || {}).length; }

const AREAS = {
  1:"Cognitive", 2:"Expressive Language", 3:"Gross Motor",
  4:"Fine Motor", 5:"Social-Emotional", 6:"Self Help"
};

/* Footnote text quoted from the HELP Checklist, page 2. */
const FOOTNOTES = {
  1:"Additional information and definitions of skills may be obtained by referring to the Guide.",
  2:"Refers to skills that should not be taught although they do relate to behaviors typical of the child's age, i.e., they occur as a natural part of the child's development."
};

const STATUSES = [
  {key:"notyet",   label:"Not yet"},
  {key:"emerging", label:"Emerging"},
  {key:"mastered", label:"Mastered"},
  {key:"assess",   label:"To assess"}
];

/* ---------------- storage (this device only) ---------------- */
const KEY = "help-tracker-v1";
let db = {child:{name:"", birthdate:"", ageMonths:null}, rec:{}, fix:{}};

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const p = JSON.parse(raw);
      db = {child:Object.assign({name:"",birthdate:"",ageMonths:null}, p.child||{}), rec:p.rec||{}, fix:p.fix||{}};
    }
  }catch(e){ /* private mode / blocked storage: run with empty data */ }
}
let storageBroken = false;

function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify(db));
    storageBroken = false;
  }catch(e){
    /* quota, private browsing, or a browser refusing storage on this page */
    storageBroken = true;
    const bar = document.getElementById("storagewarn");
    if(bar) bar.hidden = false;
  }
}

/* Writing and reading back a probe is the only way to know whether this
   browser will keep anything. It cannot tell us the data will still be here
   tomorrow - only that saving works at all right now. */
function storageWorks(){
  try{
    const k = KEY + ".probe";
    localStorage.setItem(k, "1");
    const ok = localStorage.getItem(k) === "1";
    localStorage.removeItem(k);
    return ok;
  }catch(e){ return false; }
}
function rec(id){
  if(!db.rec[id]) db.rec[id] = {status:"", date:"", notes:"", ideas:[], plan:"", activity:""};
  if(db.rec[id].plan == null) db.rec[id].plan = "";           // records saved before plans existed
  if(db.rec[id].activity == null) db.rec[id].activity = "";   // ditto for activity labels
  return db.rec[id];
}

/* ---------------- age ---------------- */
function ageMonths(){
  if(db.child.birthdate){
    const b = new Date(db.child.birthdate + "T00:00:00");
    if(!isNaN(b)){
      const n = new Date();
      let m = (n.getFullYear()-b.getFullYear())*12 + (n.getMonth()-b.getMonth());
      if(n.getDate() < b.getDate()) m -= 1;
      const anchor = new Date(b.getFullYear(), b.getMonth()+m, b.getDate());
      const nextm  = new Date(b.getFullYear(), b.getMonth()+m+1, b.getDate());
      const frac = (n - anchor) / (nextm - anchor);
      return Math.max(0, m + (isFinite(frac) ? frac : 0));
    }
  }
  if(db.child.ageMonths != null && db.child.ageMonths !== "") return Number(db.child.ageMonths);
  return null;
}
function ageLabel(){
  const m = ageMonths();
  if(m == null) return "Set age";
  const whole = Math.floor(m);
  const y = Math.floor(whole/12), r = whole%12;
  const yr = y ? y + (y===1?" yr ":" yrs ") : "";
  return whole + " mo" + (y ? " (" + yr + r + " mo)" : "");
}

/* ---------------- classification ---------------- */
/* An item is "past its age band" when the child is older than the top of
   the printed range. Items printed open-ended (e.g. "33+") never expire. */
function pastBand(it, m){ return m != null && it.hi != null && m > it.hi; }

function bucket(it, m){
  const st = (db.rec[it.id] || {}).status || "";
  if(!pastBand(it, m)) return null;
  if(it.f) return "footnoted";               // book says these are not skills to teach
  if(st === "notyet" || st === "emerging") return "attention";
  if(st === "") return "check";
  return null;                                // mastered
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtDate(iso){
  if(!iso) return "";
  const d = new Date(iso + "T00:00:00");
  if(isNaN(d)) return iso;
  return d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
}
function today(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function hahLabel(h){
  if(h === "n/a") return "no handout listed";
  if(h === "?")   return "page unreadable in your copy";
  return "HELP…at Home p. " + h;
}

/* ---------------- rendering: one item row ---------------- */
function itemMetaHtml(it, m){
  const r  = db.rec[it.id] || {status:"",date:"",notes:"",ideas:[]};
  const st = r.status || "";
  const tags = [];
  tags.push('<span class="tag">' + esc(it.age) + ' mo</span>');
  tags.push('<span class="tag book">' + esc(hahLabel(it.h)) + '</span>');
  if(it.f) tags.push('<span class="tag warn">footnote ' + it.f + '</span>');
  if(it.fixed) tags.push('<span class="tag">edited</span>');
  if(pastBand(it, m) && !it.f && (st === "notyet" || st === "emerging")) tags.push('<span class="tag warn">past age band</span>');
  if(st === "assess") tags.push('<span class="tag assess">to assess' + ((r.plan || "").trim() ? ' \u00b7 activity ready' : ' \u00b7 no activity yet') + '</span>');
  if(r.date) tags.push('<span class="tag">' + esc(fmtDate(r.date)) + '</span>');

  return '<span class="tag">' + it.id + '</span>' + tags.join("");
}

function itemRow(it, m){
  const r  = db.rec[it.id] || {status:"",date:"",notes:"",ideas:[],plan:"",activity:""};
  const st = r.status || "";

  const ideas = (r.ideas || []).map((t,i) =>
    '<li><span>' + esc(t) + '</span><button type="button" data-del-idea="' + i + '" aria-label="Remove idea">&times;</button></li>'
  ).join("");

  return '<li class="item" data-id="' + it.id + '">' +
    '<button class="item-head" type="button" data-toggle>' +
      '<span class="dot ' + st + '"></span>' +
      '<span class="item-main">' +
        '<span class="item-skill">' + esc(it.s) + '</span>' +
        '<span class="item-meta">' + itemMetaHtml(it, m) + '</span>' +
      '</span>' +
    '</button>' +
    '<div class="item-body">' +
      '<div class="statusrow">' +
        STATUSES.map(s =>
          '<button type="button" class="' + s.key + '" data-status="' + s.key + '" aria-pressed="' + (st===s.key) + '">' + s.label + '</button>'
        ).join("") +
      '</div>' +
      (st ? '<button type="button" class="btn ghost small" data-status="">Clear mark</button>' : '') +
      (it.f ? '<p class="small muted" style="margin-top:10px"><b>Footnote ' + it.f + ':</b> ' + esc(FOOTNOTES[it.f]) + '</p>' : '') +
      (st === "assess"
        ? '<div class="planbox">' +
            '<span class="lbl">How will you check this with her?</span>' +
            '<input type="text" data-activity list="activity-names" placeholder="Activity or setting \u2014 e.g. colouring, snack, bath" value="' + esc(r.activity || "") + '" style="margin-bottom:8px" />' +
            '<textarea data-plan placeholder="What you\u2019ll need, and what you\u2019ll ask her to do">' + esc(r.plan || "") + '</textarea>' +
            '<p class="small muted" style="margin:6px 0 0">' + esc(hahLabel(it.h)) + (it.h === "n/a" || it.h === "?" ? '' : ' has the handout for this one.') + '</p>' +
          '</div>'
        : '') +
      '<label class="field"><span>Notes</span><textarea data-notes placeholder="What you saw, when, in what setting">' + esc(r.notes || "") + '</textarea></label>' +
      '<label class="field"><span>My activity ideas</span></label>' +
      '<ul class="ideas">' + ideas + '</ul>' +
      '<div class="addrow"><input type="text" data-idea placeholder="Add an idea" /><button type="button" class="btn" data-add-idea>Add</button></div>' +
      fixPanel(it) +
    '</div>' +
  '</li>';
}

/* Corrections to the book details themselves. The skills here were transcribed
   from photographs, so a page number or age range can be wrong; this is how you
   put it right, for good. */
function fixPanel(it){
  const base = baseItem(it.id) || it;
  const f = (db.fix || {})[it.id] || {};
  const changed = !!Object.keys(f).length;
  return '<details class="foot fixpanel"' + (changed ? ' open' : '') + '>' +
    '<summary>' + (changed ? 'Book details \u2014 edited' : 'Fix the book details') + '</summary>' +
    '<div>' +
      '<label class="field"><span>Age range in months</span>' +
        '<input type="text" data-fix="age" value="' + esc(f.age || "") + '" placeholder="' + esc(base.age) + '" /></label>' +
      '<p class="small muted fixerr" hidden>Write it like <b>8-10</b>, <b>5\u00bd-7\u00bd</b> or <b>33+</b>. Not saved until it reads.</p>' +
      '<label class="field"><span>HELP\u2026at Home page</span>' +
        '<input type="text" data-fix="h" value="' + esc(f.h || "") + '" placeholder="' + esc(base.h) + '" /></label>' +
      '<label class="field"><span>Skill wording</span>' +
        '<textarea data-fix="s" placeholder="' + esc(base.s) + '">' + esc(f.s || "") + '</textarea></label>' +
      '<p class="small muted" style="margin-top:8px">As transcribed: ' + esc(base.age) + ' mo \u00b7 ' + esc(hahLabel(base.h)) + '</p>' +
      (changed ? '<button type="button" class="btn ghost small" data-fix-reset style="margin-top:8px">Put back the transcribed values</button>' : '') +
    '</div>' +
  '</details>';
}

/* After a correction, update only the parts of the row that a correction can
   change. Re-rendering the list here would tear out whichever field the cursor
   was heading for, and the edit would go into a detached element. */
/* "HELP...at Home p. 83" reads well on screen; on paper the prefix is repeated
   on every line and adds nothing, so it is dropped there. */
function hahBits(h){
  if(h === "n/a") return '<span class="long-only">no handout listed</span><span class="short-only">\u2014</span>';
  if(h === "?")   return '<span class="long-only">page unreadable in your copy</span><span class="short-only">p. ?</span>';
  return '<span class="long-only">HELP\u2026at Home </span>p. ' + esc(h);
}

function sheetMetaHtml(it){
  const r = db.rec[it.id] || {};
  const act = (r.activity || "").trim();
  return it.id + ' \u00b7 ' + esc(it.age) + ' mo \u00b7 ' + hahBits(it.h) +
    (it.f ? ' \u00b7 fn' + it.f : '') +
    (act ? '<span class="act-bit"> \u00b7 ' + esc(act) + '</span>' : '');
}

/* The same skill can be on screen twice - in the Skills list and on the Assess
   sheet - so refresh every copy of it, whichever shape it takes. */
function refreshFixRow(id){
  const it = ITEMS.find(i => i.id === id);
  if(!it) return;
  const hosts = document.querySelectorAll('li.item[data-id="' + id + '"], .sheet-item[data-id="' + id + '"]');
  for(const host of hosts) refreshOneRow(host, it);
}

function refreshOneRow(host, id_or_it){
  const it = id_or_it;
  const skill = host.querySelector(".item-skill");
  if(skill) skill.textContent = it.s;
  const h3 = host.querySelector("h3");
  if(h3) h3.textContent = it.s;

  const meta = host.querySelector(".item-meta");
  if(meta) meta.innerHTML = itemMetaHtml(it, ageMonths());
  const smeta = host.querySelector(".sheet-meta");
  if(smeta) smeta.innerHTML = sheetMetaHtml(it);

  const id = it.id;
  const panel = host.querySelector(".fixpanel");
  if(!panel) return;
  const changed = !!Object.keys((db.fix || {})[id] || {}).length;
  const sum = panel.querySelector("summary");
  if(sum) sum.textContent = changed ? "Book details \u2014 edited" : "Fix the book details";

  let btn = panel.querySelector("[data-fix-reset]");
  if(changed && !btn){
    btn = document.createElement("button");
    btn.type = "button";
    btn.className = "btn ghost small";
    btn.style.marginTop = "8px";
    btn.setAttribute("data-fix-reset", "");
    btn.textContent = "Put back the transcribed values";
    const box = panel.querySelector("div");
    if(box) box.appendChild(btn);
  }else if(!changed && btn){
    btn.remove();
  }
}

/* ---------------- view: Focus ---------------- */
function renderFocus(){
  const m = ageMonths();
  const el = document.getElementById("view-focus");

  if(m == null){
    el.innerHTML =
      '<div class="card">' +
        '<h2>Start here</h2>' +
        '<p class="sub">Enter her age so the app can tell which skills have gone past their age band. Nothing you type leaves this device.</p>' +
        '<button type="button" class="btn wide" data-goto="setup">Go to Setup</button>' +
      '</div>';
    return;
  }

  const attention = [], check = [], footnoted = [];
  let assessed = 0, mastered = 0, toAssess = 0;
  for(const it of ITEMS){
    const st = (db.rec[it.id] || {}).status || "";
    if(st) assessed++;
    if(st === "mastered") mastered++;
    if(st === "assess") toAssess++;
    const b = bucket(it, m);
    if(b === "attention") attention.push(it);
    else if(b === "check") check.push(it);
    else if(b === "footnoted" && st !== "mastered") footnoted.push(it);
  }

  attention.sort((a, b) => a.hi - b.hi);   // earliest gap first: you teach from where she is

  const pct = Math.round(mastered / ITEMS.length * 100);
  let html =
    '<div class="card">' +
      '<h2>' + (db.child.name ? esc(db.child.name) : "Progress") + '</h2>' +
      '<p class="sub">' + esc(ageLabel()) + ' &middot; ' + ITEMS.length + ' HELP skills, birth to three years</p>' +
      '<div class="stats">' +
        '<div class="stat"><b>' + mastered + '</b><span>MASTERED</span></div>' +
        '<div class="stat"><b>' + toAssess + '</b><span>TO ASSESS</span></div>' +
        '<div class="stat"><b>' + attention.length + '</b><span>NEED WORK</span></div>' +
      '</div>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
    '</div>';

  html += '<div class="sectionlabel">Needs attention &middot; ' + attention.length + '</div>';
  if(attention.length){
    html += '<div class="note" style="margin-bottom:10px">Past her age band and marked Not yet or Emerging. Your checklist’s planning guideline reads: &ldquo;Skills which are assessed as &minus; or E can be targeted for intervention unless they have a footnote.&rdquo;</div>';
    html += '<ul class="items">' + attention.map(it => itemRow(it, m)).join("") + '</ul>';
  }else{
    html += '<div class="card"><div class="empty">Nothing flagged. Skills you mark Not yet or Emerging show up here once she passes the top of their age range.</div></div>';
  }

  if(check.length){
    check.sort((a, b) => b.hi - a.hi);   // closest to her age first
    html += '<div class="sectionlabel">Worth checking &middot; ' + check.length + '</div>' +
            '<div class="note" style="margin-bottom:10px">Past her age band but not marked yet, so the app can’t tell where she stands. Closest to her age first.</div>' +
            '<ul class="items">' + check.slice(0,40).map(it => itemRow(it, m)).join("") + '</ul>' +
            (check.length > 40 ? '<p class="small muted">Showing 40 of ' + check.length + '. The rest are in the Skills tab under the Unmarked filter.</p>' : '');
  }

  if(footnoted.length){
    html += '<details class="foot"><summary>' + footnoted.length + ' footnoted skills are past her age band and are held back from the list above</summary><div>' +
      '<p class="small muted">The checklist says footnoted items are not skills to teach &mdash; they are there for evaluation and anticipatory guidance. They are kept out of &ldquo;Needs attention&rdquo; for that reason.</p>' +
      '<ul class="items">' + footnoted.map(it => itemRow(it, m)).join("") + '</ul></div></details>';
  }

  el.innerHTML = html;
}

/* ---------------- view: Skills ---------------- */
let fArea = 0, fStatus = "all", fQuery = "", fGroup = true;
let collapsed = {};      // band -> true when folded shut
let lastBulk = null;     // one-step undo for the most recent bulk mark

/* Skills are grouped into three-month bands by where the skill starts
   appearing, which is how the printed checklist reads. A few items have an
   unreadable lower bound; those fall back to the top of their range. */
function ageBand(it){
  const base = (it.lo != null) ? it.lo : it.hi;
  if(base == null) return 33;
  return Math.min(33, Math.floor(base / 3) * 3);
}
function bandLabel(b){
  return b >= 33 ? "33 months and up" : b + "\u2013" + (b + 3) + " months";
}

function renderSkills(){
  const m = ageMonths();
  const el = document.getElementById("view-skills");

  const areaChips = ['<button type="button" class="chip" data-area="0" aria-pressed="' + (fArea===0) + '">All</button>']
    .concat(Object.keys(AREAS).map(k =>
      '<button type="button" class="chip" data-area="' + k + '" aria-pressed="' + (fArea==k) + '">' + AREAS[k] + '</button>'
    )).join("");

  const statusChips = [["all","All"],["notyet","Not yet"],["emerging","Emerging"],["mastered","Mastered"],["assess","To assess"],["none","Unmarked"],["attention","Needs attention"]]
    .map(([k,l]) => '<button type="button" class="chip" data-status-filter="' + k + '" aria-pressed="' + (fStatus===k) + '">' + l + '</button>').join("");

  const q = fQuery.trim().toLowerCase();
  const list = ITEMS.filter(it => {
    if(fArea && it.a != fArea) return false;
    const st = (db.rec[it.id] || {}).status || "";
    if(fStatus === "none" && st) return false;
    if(fStatus === "attention" && bucket(it, m) !== "attention") return false;
    if(["notyet","emerging","mastered","assess"].includes(fStatus) && st !== fStatus) return false;
    if(q && !(it.s.toLowerCase().includes(q) || it.id.includes(q))) return false;
    return true;
  });

  let body;
  if(!list.length){
    body = '<div class="card"><div class="empty">No skills match those filters.</div></div>';
  }else if(!fGroup){
    body = '<ul class="items">' + list.map(it => itemRow(it, m)).join("") + '</ul>';
  }else{
    const bands = {};
    for(const it of list){
      const b = ageBand(it);
      (bands[b] = bands[b] || []).push(it);
    }
    body = Object.keys(bands).map(Number).sort((a, b) => a - b).map(b => {
      const rows = bands[b];
      const done = rows.filter(it => ((db.rec[it.id] || {}).status || "") === "mastered").length;
      const blank = rows.filter(it => !((db.rec[it.id] || {}).status || "")).length;
      const shut = !!collapsed[b];
      /* the sweep button sits at the foot of the band, so you read the
         skills first and log them once you have been through them */
      const justDone = lastBulk && lastBulk.band === b;
      let foot = "";
      if(justDone){
        foot = '<div class="band-foot"><div class="undobar"><span>' +
          lastBulk.ids.length + ' skill' + (lastBulk.ids.length === 1 ? "" : "s") +
          ' set to \u201c' + (STATUS_LABEL[lastBulk.status] || lastBulk.status) + '\u201d here.' +
          '</span><button type="button" data-undo>Undo</button></div></div>';
      }else if(blank){
        foot = '<div class="band-foot">' +
          '<p>Been through these? Any sweep touches only the ' + blank + ' you haven\u2019t set yet, and leaves your existing marks alone.</p>' +
          '<button type="button" class="btn" data-bulk="' + b + '" data-bulk-status="mastered">Mark ' + blank + ' mastered</button>' +
          '<div class="sweep-row">' +
            '<button type="button" class="btn ghost" data-bulk="' + b + '" data-bulk-status="assess">Flag ' + blank + ' to assess</button>' +
            '<button type="button" class="btn ghost" data-bulk="' + b + '" data-bulk-status="notyet">Mark ' + blank + ' not yet</button>' +
          '</div>' +
        '</div>';
      }
      return '<section class="band' + (shut ? " collapsed" : "") + '">' +
        '<div class="band-head">' +
          '<button type="button" class="band-toggle" data-band-toggle="' + b + '" aria-label="Show or hide this band">' + (shut ? "\u25b8" : "\u25be") + '</button>' +
          '<span class="band-title"><b>' + bandLabel(b) + '</b>' +
            '<span>' + rows.length + ' skill' + (rows.length === 1 ? "" : "s") + ' \u00b7 ' + done + ' mastered' +
            (blank ? ' \u00b7 ' + blank + ' unmarked' : '') + '</span></span>' +
        '</div>' +
        '<div class="band-body"><ul class="items">' + rows.map(it => itemRow(it, m)).join("") + '</ul>' + foot + '</div>' +
      '</section>';
    }).join("");
  }

  el.innerHTML =
    '<div class="card">' +
      '<div class="filters">' + areaChips + '</div>' +
      '<div class="filters">' + statusChips + '</div>' +
      '<div class="filters">' +
        '<button type="button" class="chip" data-group="1" aria-pressed="' + fGroup + '">Grouped by age</button>' +
        '<button type="button" class="chip" data-group="0" aria-pressed="' + !fGroup + '">One long list</button>' +
      '</div>' +
      '<input type="text" id="q" placeholder="Search skills or item number" value="' + esc(fQuery) + '" />' +
      '<p class="sub" style="margin:8px 0 0">' + list.length + ' of ' + ITEMS.length + ' skills' +
        (fGroup ? ' \u00b7 Each band has sweep buttons at the bottom, after the skills.' : '') +
      '</p>' +
    '</div>' + body;
}

/* ---------------- view: Assess ----------------
   Everything flagged "To assess", laid out as a sheet to print or save and
   carry around while you actually sit down and test her. */

let assessGroup = "activity", assessFilter = "all", printRoomy = false;

function assessList(){
  return ITEMS.filter(it => ((db.rec[it.id] || {}).status || "") === "assess");
}

function assessText(){
  const list = assessList();
  const lines = ["SKILLS TO ASSESS"];
  if(db.child.name) lines.push("Child: " + db.child.name);
  const m = ageMonths();
  if(m != null) lines.push("Age: " + Math.floor(m) + " months");
  lines.push("Printed: " + today());
  for(const [label, rows] of assessGroupsOf(list)){
    lines.push("");
    lines.push("--- " + label.toUpperCase() + " ---");
    for(const it of rows){
      const r = db.rec[it.id] || {};
      lines.push("");
      lines.push(it.id + "  " + it.s);
      lines.push("  Age band: " + it.age + " mo   " + hahLabel(it.h));
      lines.push("  How to check: " + ((r.plan || "").trim() || "______________________________"));
      lines.push("  Result:   Mastered / Emerging / Not yet");
    }
  }
  lines.push("");
  lines.push("(" + list.length + (list.length === 1 ? " skill)" : " skills)"));
  return lines.join("\n");
}

function activityNames(){
  const set = new Set();
  for(const it of assessList()){
    const a = ((db.rec[it.id] || {}).activity || "").trim();
    if(a) set.add(a);
  }
  return [...set].sort((x, y) => x.localeCompare(y));
}

function assessGroupsOf(list){
  /* by activity: your own labels, so a colouring session shows every skill you
     can check while colouring, whatever developmental area it belongs to */
  const groups = new Map();
  if(assessGroup === "activity"){
    for(const it of list){
      const key = ((db.rec[it.id] || {}).activity || "").trim() || "\u2014 no activity set";
      if(!groups.has(key)) groups.set(key, []);
      groups.get(key).push(it);
    }
    return [...groups.entries()].sort((a, b) => {
      const an = a[0].startsWith("\u2014"), bn = b[0].startsWith("\u2014");
      if(an !== bn) return an ? 1 : -1;          // unlabelled last
      return a[0].localeCompare(b[0]);
    });
  }
  for(const areaKey of Object.keys(AREAS)){
    const rows = list.filter(it => it.a == areaKey);
    if(rows.length) groups.set(AREAS[areaKey], rows);
  }
  return [...groups.entries()];
}

function renderAssess(){
  const el = document.getElementById("view-assess");
  let list = assessList();
  const acts = activityNames();

  if(assessFilter !== "all"){
    list = list.filter(it => {
      const a = ((db.rec[it.id] || {}).activity || "").trim();
      return assessFilter === "__none" ? !a : a === assessFilter;
    });
  }

  if(!assessList().length){
    el.innerHTML =
      '<div class="card">' +
        '<h2>Nothing flagged to assess</h2>' +
        '<p class="sub">When you hit a skill you can\u2019t call without testing her on it, mark it <b>To assess</b>. They gather here, where you can group them by the activity you\u2019ll do them in, work through them on screen, or print the lot.</p>' +
        '<button type="button" class="btn wide" data-goto="skills">Go to Skills</button>' +
      '</div>';
    return;
  }

  const withPlan = list.filter(it => ((db.rec[it.id] || {}).plan || "").trim()).length;

  const actChips = ['<button type="button" class="chip" data-afilter="all" aria-pressed="' + (assessFilter === "all") + '">All</button>']
    .concat(acts.map(a =>
      '<button type="button" class="chip" data-afilter="' + esc(a) + '" aria-pressed="' + (assessFilter === a) + '">' + esc(a) + '</button>'
    ))
    .concat(['<button type="button" class="chip" data-afilter="__none" aria-pressed="' + (assessFilter === "__none") + '">No activity set</button>'])
    .join("");

  let html =
    '<div class="card noprint">' +
      '<h2>' + list.length + ' skill' + (list.length === 1 ? "" : "s") + ' to assess</h2>' +
      '<p class="sub">Mark a result here as you go and the skill leaves this list. ' + withPlan + ' of these have an activity written down.</p>' +
      '<div class="filters">' +
        '<button type="button" class="chip" data-agroup="activity" aria-pressed="' + (assessGroup === "activity") + '">Group by activity</button>' +
        '<button type="button" class="chip" data-agroup="area" aria-pressed="' + (assessGroup === "area") + '">Group by area</button>' +
      '</div>' +
      (acts.length ? '<div class="filters">' + actChips + '</div>' : '') +
      '<div class="filters">' +
        '<button type="button" class="chip" data-density="0" aria-pressed="' + (!printRoomy) + '">Compact print</button>' +
        '<button type="button" class="chip" data-density="1" aria-pressed="' + printRoomy + '">Room to write</button>' +
      '</div>' +
      '<button type="button" class="btn wide" id="printsheet">Print this list, or save as PDF</button>' +
      '<button type="button" class="btn ghost wide" id="copysheet">Copy this list for Notes</button>' +
    '</div>';

  html += '<div class="card' + (printRoomy ? " roomy" : "") + (assessGroup === "activity" ? " by-activity" : "") + '" style="padding-top:6px">' +
    '<h2 style="margin-bottom:2px">Skills to assess</h2>' +
    '<p class="sub">' + (db.child.name ? esc(db.child.name) + " \u00b7 " : "") +
      (ageMonths() != null ? esc(ageLabel()) + " \u00b7 " : "") + esc(fmtDate(today())) +
      (assessFilter !== "all" ? " \u00b7 " + esc(assessFilter === "__none" ? "no activity set" : assessFilter) : "") + '</p>' +
    '<p class="sub printonly sheet-legend">Under each skill: how to check it, then <b>M</b> mastered \u00b7 <b>E</b> emerging \u00b7 <b>N</b> not yet, and room for a note.</p>';

  if(!list.length){
    html += '<div class="empty">Nothing under that activity.</div></div>';
    el.innerHTML = html;
    return;
  }

  for(const [label, rows] of assessGroupsOf(list)){
    html += '<div class="sectionlabel">' + esc(label) + ' &middot; ' + rows.length + '</div>';
    for(const it of rows){
      const r = db.rec[it.id] || {};
      const plan = (r.plan || "").trim();
      const act  = (r.activity || "").trim();
      html += '<div class="sheet-item" data-id="' + it.id + '">' +
        '<h3>' + esc(it.s) + '</h3>' +
        '<div class="sheet-meta">' + sheetMetaHtml(it) + '</div>' +

        '<div class="sheet-act noprint">' +
          '<label>Activity</label>' +
          '<input type="text" data-activity list="activity-names" value="' + esc(act) + '" placeholder="e.g. colouring, snack, bath" />' +
        '</div>' +

        '<div class="noprint"><textarea data-plan placeholder="How you\u2019ll check it \u2014 what you\u2019ll need, what you\u2019ll ask her to do">' + esc(plan) + '</textarea></div>' +
        '<p class="sheet-plan printonly">' +
          (plan ? esc(plan) : '<span class="sheet-blank"></span>') + '</p>' +

        '<div class="statusrow noprint">' +
          STATUSES.filter(st => st.key !== "assess").map(st =>
            '<button type="button" class="' + st.key + '" data-result="' + st.key + '">' + st.label + '</button>'
          ).join("") +
        '</div>' +

        '<div class="sheet-result printonly"><span class="ticks">&#9744;&nbsp;M &nbsp; &#9744;&nbsp;E &nbsp; &#9744;&nbsp;N</span>' +
          '<div class="sheet-blank"></div></div>' +
        '<div class="noprint">' + fixPanel(it) + '</div>' +
      '</div>';
    }
  }
  html += '</div>';
  html += '<datalist id="activity-names">' + acts.map(a => '<option value="' + esc(a) + '"></option>').join("") + '</datalist>';
  el.innerHTML = html;
}

        ? '<details class="foot" open><summary>See them</summary><div><pre style="white-space:pre-wrap;word-break:break-word;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px;margin:8px 0 0;overflow-x:auto">' +
            esc(correctionLines().join("\n")) + '</pre></div></details>'
        : '') +
      '<button type="button" class="btn ghost wide" id="copyfixes">Copy just the corrections</button>' +
      '<label class="field"><span>Apply corrections from another copy</span><textarea id="fixbox" placeholder="Paste corrections here"></textarea></label>' +
      '<button type="button" class="btn ghost wide" id="applyfixes">Apply these corrections</button>' +
      '<p class="small muted" style="margin-top:8px">This only changes the book details. It never touches a child\u2019s marks, so it is how you carry a fix over to another child.</p>' +
    '</div>' +

    '<div class="card">' +
      '<h2>What the marks mean</h2>' +
      '<p class="sub">This app uses plain words. Your paper checklist uses symbols &mdash; here is how they line up.</p>' +
      '<dl class="legend">' +
        '<dt>Mastered</dt><dd>Your checklist’s <b>+</b> &mdash; &ldquo;the skill was observed or appropriately absent.&rdquo;</dd>' +
        '<dt>Emerging</dt><dd>Your checklist’s <b>E</b> &mdash; &ldquo;the skill appears to be emerging but not complete, consistent, or of good quality.&rdquo;</dd>' +
        '<dt>Not yet</dt><dd>Your checklist’s <b>&minus;</b> &mdash; &ldquo;the skill was assessed but not observed or reported.&rdquo;</dd>' +
        '<dt>To assess</dt><dd>Not one of the checklist\u2019s symbols &mdash; it is this app\u2019s own. It means you cannot call the skill without testing her on it. These gather on the <b>Assess</b> tab as a sheet to print.</dd>' +
        '<dt>Unmarked</dt><dd>Left blank, as on paper: not assessed.</dd>' +
      '</dl>' +
      '<p class="small muted" style="margin-top:10px">The paper checklist also has <b>R</b>, &ldquo;the skill was reported by parent.&rdquo; There is no separate button for it here &mdash; note it in the Notes box if you need the distinction.</p>' +
    '</div>' +

    '<div class="card">' +
      '<h2>Where the skills came from</h2>' +
      '<p class="sub">All 685 skills, age ranges, and page references were transcribed from your HELP Checklist (Hawaii Early Learning Profile), Birth to Three years, VORT Corporation. Activity ideas are only ever the ones you type in yourself.</p>' +
      '<details class="foot"><summary>Fields I could not read in your scanned copy</summary><div class="small muted">' +
        '<p>A few cells were hidden behind the PDF reader’s toolbar or under handwriting. Everything else came through clean. Worth filling in from the book:</p>' +
        '<ul>' +
          '<li>Age range, first number only: 1.45, 1.46, 1.133, 2.57, 3.44, 3.134, 4.76, 5.64, 6.52</li>' +
          '<li>HELP…at Home page: 1.51, 2.32, 5.73</li>' +
        '</ul>' +
        '<p>The top of each age range is known in every case, so the &ldquo;past age band&rdquo; flag still works for all of them.</p>' +
      '</div></details>' +
    '</div>' +

    '<div class="card">' +
      '<h2>Privacy</h2>' +
      '<p class="sub">This page makes no network requests of any kind. There are no external scripts, fonts, or images, no analytics, and no server. Everything you enter is held in this browser’s local storage and stays on this device.</p>' +
    '</div>';

  const pv = document.getElementById("preview");
  if(pv) pv.textContent = backupText();
}

/* ---------------- backup as readable text ----------------
   Plain text so it can live in a notes app and still be read by a human,
   but strict enough on the "id | status | date | skill" lines that the app
   can read it back. Only skills you have actually touched are written out. */

const STATUS_LABEL = {notyet:"Not yet", emerging:"Emerging", mastered:"Mastered", assess:"To assess"};
const LABEL_STATUS = {"not yet":"notyet", "emerging":"emerging", "mastered":"mastered", "to assess":"assess"};

function backupText(){
  const lines = [];
  lines.push("HELP TRACKER BACKUP");
  if(db.child.name) lines.push("Child: " + db.child.name);
  if(db.child.birthdate) lines.push("Birthdate: " + db.child.birthdate);
  const m = ageMonths();
  if(m != null) lines.push("Age at save: " + Math.floor(m) + " months");
  lines.push("Saved: " + today());
  lines.push("");
  lines.push("To restore: copy this whole note and paste it into Setup > Restore.");

  let count = 0;
  for(const areaKey of Object.keys(AREAS)){
    const rows = ITEMS.filter(it => {
      if(it.a != areaKey) return false;
      const r = db.rec[it.id];
      return r && (r.status || (r.notes || "").trim() || (r.ideas || []).length || (r.plan || "").trim() || (r.activity || "").trim());
    });
    if(!rows.length) continue;
    lines.push("");
    lines.push("--- " + AREAS[areaKey].toUpperCase() + " ---");
    lines.push("");
    for(const it of rows){
      const r = db.rec[it.id];
      count++;
      lines.push(it.id + " | " + (STATUS_LABEL[r.status] || "Unmarked") + " | " + (r.date || "") + " | " + it.s);
      const act = (r.activity || "").trim();
      if(act) lines.push("  Activity: " + act.replace(/\s*\n+\s*/g, " / "));
      const plan = (r.plan || "").trim();
      if(plan) lines.push("  Plan: " + plan.replace(/\s*\n+\s*/g, " / "));
      const note = (r.notes || "").trim();
      /* notes are folded onto one line so a stray newline can't break parsing */
      if(note) lines.push("  Note: " + note.replace(/\s*\n+\s*/g, " / "));
      for(const idea of (r.ideas || [])){
        lines.push("  Idea: " + String(idea).replace(/\s*\n+\s*/g, " / "));
      }
    }
  }
  const fixes = correctionLines();
  if(fixes.length){
    lines.push("");
    lines.push("--- CORRECTIONS ---");
    lines.push("");
    lines.push.apply(lines, fixes);
  }

  lines.push("");
  lines.push("END OF BACKUP (" + count + (count === 1 ? " skill)" : " skills)"));
  return lines.join("\n");
}

/* One line per corrected field, so a fix can be read, checked and moved to
   another device without carrying any child's data with it. */
function correctionLines(){
  const out = [];
  const fx = db.fix || {};
  for(const id of Object.keys(fx).sort()){
    for(const field of ["age","h","s"]){
      const v = fx[id][field];
      if(v != null && v !== ""){
        const name = field === "h" ? "page" : (field === "s" ? "skill" : "age");
        out.push("FIX " + id + " | " + name + " | " + String(v).replace(/\s*\n+\s*/g, " / "));
      }
    }
  }
  return out;
}

function correctionsText(){
  const fixes = correctionLines();
  return ["HELP TRACKER CORRECTIONS",
          "Fixes to the transcribed book details. No child's data in here.",
          "Saved: " + today(),
          "",
          "--- CORRECTIONS ---",
          ""].concat(fixes.length ? fixes : ["(none yet)"]).join("\n");
}

/* Reads FIX lines out of either a corrections note or a full backup. */
function parseCorrections(raw){
  const fix = {};
  for(const line of String(raw || "").split(/\r?\n/)){
    const m = line.trim().match(/^FIX\s+(\d+\.\d+)\s*\|\s*(page|age|skill)\s*\|\s*(.*)$/i);
    if(!m) continue;
    const id = m[1];
    if(!BASE_ITEMS.some(i => i.id === id)) continue;
    const field = m[2].toLowerCase() === "page" ? "h" : (m[2].toLowerCase() === "skill" ? "s" : "age");
    const val = m[3].trim();
    if(!val) continue;
    if(field === "age" && !parseAge(val)) continue;   // never take an unreadable range
    fix[id] = fix[id] || {};
    fix[id][field] = val;
  }
  return fix;
}

/* Reads back either the text above or the older JSON shape. */
function parseBackup(raw){
  const txt = String(raw || "").trim();
  if(!txt) return null;

  if(txt.charAt(0) === "{"){
    const p = JSON.parse(txt);
    if(!p || !p.rec) return null;
    return {child:Object.assign({name:"",birthdate:"",ageMonths:null}, p.child||{}), rec:p.rec, fix:p.fix||{}};
  }

  if(!/HELP TRACKER BACKUP/i.test(txt)) return null;

  const out = {child:{name:"", birthdate:"", ageMonths:null}, rec:{}, fix:parseCorrections(txt)};
  const valid = new Set(ITEMS.map(i => i.id));
  let current = null;

  for(const rawLine of txt.split(/\r?\n/)){
    const line = rawLine.trim();

    let m = line.match(/^Child:\s*(.*)$/i);
    if(m){ out.child.name = m[1].trim(); continue; }
    m = line.match(/^Birthdate:\s*([0-9]{4}-[0-9]{2}-[0-9]{2})\s*$/i);
    if(m){ out.child.birthdate = m[1]; continue; }
    m = line.match(/^Age at save:\s*(\d+)/i);
    if(m){ out.child.ageMonths = Number(m[1]); continue; }

    m = line.match(/^(\d+\.\d+)\s*\|\s*([^|]*?)\s*\|\s*([^|]*?)\s*\|/);
    if(m && valid.has(m[1])){
      current = {status: LABEL_STATUS[m[2].toLowerCase()] || "", date: m[3].trim(), notes:"", ideas:[], plan:"", activity:""};
      out.rec[m[1]] = current;
      continue;
    }

    m = line.match(/^Activity:\s*(.*)$/i);
    if(m && current){ current.activity = m[1].trim(); continue; }
    m = line.match(/^Plan:\s*(.*)$/i);
    if(m && current){ current.plan = m[1].trim(); continue; }
    m = line.match(/^Note:\s*(.*)$/i);
    if(m && current){ current.notes = m[1].trim(); continue; }
    m = line.match(/^Idea:\s*(.*)$/i);
    if(m && current && m[1].trim()){ current.ideas.push(m[1].trim()); continue; }
  }

  return Object.keys(out.rec).length || Object.keys(out.fix).length || out.child.name || out.child.birthdate || out.child.ageMonths != null
    ? out : null;
}

/* navigator.clipboard needs a secure context, which a page opened straight
   from a file is not. Falling back to alert() is useless on a phone - you
   cannot select text out of a dialog - so drop the text into a box instead,
   selected and ready to copy. */
function copyText(btn, txt, label){
  const restore = () => { btn.textContent = label; };
  const done = () => { btn.textContent = "Copied"; setTimeout(restore, 2000); };
  const fallback = () => {
    let ta = btn.nextElementSibling;
    if(!ta || !ta.classList.contains("copyout")){
      ta = document.createElement("textarea");
      ta.className = "copyout";
      ta.setAttribute("readonly", "readonly");
      btn.insertAdjacentElement("afterend", ta);
    }
    ta.value = txt;
    ta.focus();
    try{ ta.setSelectionRange(0, ta.value.length); }catch(e){}
    btn.textContent = "Copy it from the box below";
    setTimeout(restore, 4000);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, fallback);
  }else{
    fallback();
  }
}

/* ---------------- routing ---------------- */
let tab = "focus";
function render(){
  document.getElementById("agechip").textContent = ageLabel();
  document.querySelectorAll("nav button").forEach(b =>
    b.setAttribute("aria-current", String(b.dataset.tab === tab))
  );
  ["focus","skills","assess","setup"].forEach(t =>
    document.getElementById("view-" + t).hidden = (t !== tab)
  );
  if(tab === "focus") renderFocus();
  if(tab === "skills") renderSkills();
  if(tab === "assess") renderAssess();
  if(tab === "setup") renderSetup();
}
function go(t){ tab = t; lastBulk = null; window.scrollTo(0,0); render(); }

/* ---------------- events ---------------- */
document.querySelector("nav").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]");
  if(b) go(b.dataset.tab);
});
document.getElementById("agechip").addEventListener("click", () => go("setup"));

document.querySelector("main").addEventListener("click", e => {
  /* works from the Skills list and the Assess sheet alike, so it runs before
     anything that assumes a Skills row */
  if(e.target.closest("[data-fix-reset]")){
    const host = e.target.closest("li.item, .sheet-item");
    if(!host) return;
    const id = host.dataset.id;
    delete (db.fix || {})[id];
    save();
    applyFixes();
    if(host.classList.contains("sheet-item")){
      renderAssess();
    }else{
      render();
      const again = document.querySelector('li.item[data-id="' + id + '"]');
      if(again) again.classList.add("open");
    }
    return;
  }

  const goto = e.target.closest("[data-goto]");
  if(goto){ go(goto.dataset.goto); return; }

  const areaBtn = e.target.closest("[data-area]");
  if(areaBtn){ fArea = Number(areaBtn.dataset.area); renderSkills(); return; }

  const stFilter = e.target.closest("[data-status-filter]");
  if(stFilter){ fStatus = stFilter.dataset.statusFilter; renderSkills(); return; }

  const grp = e.target.closest("[data-group]");
  if(grp){ fGroup = grp.dataset.group === "1"; renderSkills(); return; }

  const bandTog = e.target.closest("[data-band-toggle]");
  if(bandTog){
    const b = bandTog.dataset.bandToggle;
    collapsed[b] = !collapsed[b];
    renderSkills();
    return;
  }

  const bulk = e.target.closest("[data-bulk]");
  if(bulk){
    const b = Number(bulk.dataset.bulk);
    const newStatus = bulk.dataset.bulkStatus;
    const m2 = ageMonths();
    const q2 = fQuery.trim().toLowerCase();
    /* same filters the band is showing, so the count on the button is honest */
    const targets = ITEMS.filter(it => {
      if(ageBand(it) !== b) return false;
      if(fArea && it.a != fArea) return false;
      const st = (db.rec[it.id] || {}).status || "";
      if(st) return false;                       // never overwrite an existing mark
      if(fStatus === "attention" && bucket(it, m2) !== "attention") return false;
      if(["notyet","emerging","mastered","assess"].includes(fStatus)) return false;
      if(q2 && !(it.s.toLowerCase().includes(q2) || it.id.includes(q2))) return false;
      return true;
    });
    if(!targets.length) return;
    const stamp = today();
    for(const it of targets){
      const r = rec(it.id);
      r.status = newStatus;
      r.date = stamp;
    }
    lastBulk = {ids: targets.map(it => it.id), label: bandLabel(b), band: b, status: newStatus};
    save();
    renderSkills();
    return;
  }

  if(e.target.closest("[data-undo]")){
    if(lastBulk){
      for(const id of lastBulk.ids){
        const r = rec(id);
        r.status = ""; r.date = "";
      }
      lastBulk = null;
      save();
      renderSkills();
    }
    return;
  }

  const li = e.target.closest("li.item");

  if(e.target.closest("[data-toggle]")){ li.classList.toggle("open"); return; }
  if(!li) return;
  const id = li.dataset.id;

  const stBtn = e.target.closest("[data-status]");
  if(stBtn){
    const r = rec(id);
    const val = stBtn.dataset.status;
    r.status = val;
    r.date = val ? today() : "";
    save();
    const wasOpen = li.classList.contains("open");
    render();
    const again = document.querySelector('li.item[data-id="' + id + '"]');
    if(again && (wasOpen || val === "assess")) again.classList.add("open");
    /* flagging something to assess is a prompt to plan how you'll test it */
    if(again && val === "assess"){
      const plan = again.querySelector("[data-plan]");
      if(plan){ plan.focus(); plan.scrollIntoView({block:"center"}); }
    }
    return;
  }

  const addIdea = e.target.closest("[data-add-idea]");
  if(addIdea){
    const input = li.querySelector("[data-idea]");
    const txt = input.value.trim();
    if(txt){
      rec(id).ideas.push(txt);
      save();
      render();
      const again = document.querySelector('li.item[data-id="' + id + '"]');
      if(again){ again.classList.add("open"); again.querySelector("[data-idea]").focus(); }
    }
    return;
  }

  const delIdea = e.target.closest("[data-del-idea]");
  if(delIdea){
    rec(id).ideas.splice(Number(delIdea.dataset.delIdea), 1);
    save();
    render();
    const again = document.querySelector('li.item[data-id="' + id + '"]');
    if(again) again.classList.add("open");
    return;
  }
});

document.querySelector("main").addEventListener("input", e => {
  if(e.target.id === "q"){ fQuery = e.target.value; renderSkills();
    const box = document.getElementById("q");
    if(box){ box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
    return; }
  if(e.target.matches("[data-fix]")){
    const host = e.target.closest("li.item, .sheet-item");
    if(!host) return;
    const id = host.dataset.id, field = e.target.dataset.fix, val = e.target.value.trim();
    const panel = e.target.closest("details");
    const err = panel ? panel.querySelector(".fixerr") : null;

    if(field === "age" && val && !parseAge(val)){
      if(err) err.hidden = false;          // unreadable: say so, save nothing
      return;
    }
    if(err) err.hidden = true;

    db.fix = db.fix || {};
    const f = db.fix[id] || {};
    if(val) f[field] = val; else delete f[field];
    if(Object.keys(f).length) db.fix[id] = f; else delete db.fix[id];
    save();
    applyFixes();
    refreshFixRow(id);
    return;
  }

  if(e.target.matches("[data-plan]") || e.target.matches("[data-activity]")){
    /* these appear both in a Skills row and on the Assess sheet */
    const host = e.target.closest("li.item, .sheet-item");
    if(host){
      const field = e.target.matches("[data-plan]") ? "plan" : "activity";
      rec(host.dataset.id)[field] = e.target.value;
      save();
      if(field === "activity"){
        const meta = host.querySelector(".sheet-meta");
        if(meta) meta.dataset.dirty = "1";   // chips refresh on next full render
      }
    }
    return;
  }
  if(e.target.matches("[data-notes]")){
    const li = e.target.closest("li.item");
    rec(li.dataset.id).notes = e.target.value;
    save();
    return;
  }
  if(e.target.id === "c-name"){ db.child.name = e.target.value; save(); return; }
  if(e.target.id === "c-bd"){ db.child.birthdate = e.target.value; save(); document.getElementById("agechip").textContent = ageLabel(); return; }
  if(e.target.id === "c-am"){ db.child.ageMonths = e.target.value === "" ? null : Number(e.target.value); save(); document.getElementById("agechip").textContent = ageLabel(); return; }
});

document.querySelector("main").addEventListener("click", e => {
  const agroup = e.target.closest("[data-agroup]");
  if(agroup){ assessGroup = agroup.dataset.agroup; renderAssess(); return; }

  const dens = e.target.closest("[data-density]");
  if(dens){ printRoomy = dens.dataset.density === "1"; renderAssess(); return; }

  const afilter = e.target.closest("[data-afilter]");
  if(afilter){ assessFilter = afilter.dataset.afilter; renderAssess(); return; }

  /* recording a result from the Assess sheet: the skill is no longer
     "to assess", so it drops off this list */
  const resBtn = e.target.closest("[data-result]");
  if(resBtn){
    const card = resBtn.closest(".sheet-item");
    if(card){
      const r = rec(card.dataset.id);
      r.status = resBtn.dataset.result;
      r.date = today();
      save();
      renderAssess();
    }
    return;
  }

  if(e.target.id === "copyfixes"){
    copyText(e.target, correctionsText(), "Copy just the corrections");
    return;
  }
  if(e.target.id === "applyfixes"){
    const box = document.getElementById("fixbox");
    const incoming = parseCorrections(box.value);
    const n = Object.keys(incoming).length;
    if(!n){ alert("No corrections found in that. Each one is a line starting with FIX."); return; }
    if(confirm("Apply " + n + " correction" + (n === 1 ? "" : "s") + "? Marks and notes are not touched.")){
      db.fix = db.fix || {};
      for(const id of Object.keys(incoming)) db.fix[id] = Object.assign(db.fix[id] || {}, incoming[id]);
      save(); applyFixes(); box.value = ""; render();
    }
    return;
  }
  if(e.target.id === "printsheet"){ window.print(); return; }
  if(e.target.id === "copysheet"){
    copyText(e.target, assessText(), "Copy this list for Notes");
    return;
  }
  if(e.target.id === "export"){
    const blob = new Blob([backupText()], {type:"text/plain"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "help-tracker-backup-" + today() + ".txt";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  if(e.target.id === "copy"){
    copyText(e.target, backupText(), "Copy backup for Notes");
    return;
  }
  if(e.target.id === "import"){
    const box = document.getElementById("importbox");
    let parsed = null;
    try{ parsed = parseBackup(box.value); }catch(err){ parsed = null; }
    if(!parsed){
      alert("That doesn't look like a backup. Paste the whole thing, starting at the line HELP TRACKER BACKUP.");
      return;
    }
    const n = Object.keys(parsed.rec).length;
    if(confirm("Replace everything in the app with this backup? It has " + n + (n === 1 ? " skill" : " skills") + " in it.")){
      db = parsed; save(); applyFixes(); box.value = ""; render();
    }
  }
});

load();
applyFixes();
render();

if(!storageWorks()){
  storageBroken = true;
  const bar = document.getElementById("storagewarn");
  if(bar) bar.hidden = false;
}

/* Offline support when served over http(s). Opened straight from a file
   there is no service worker, and the app works anyway - it is one file. */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
